<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./Task3.css">
</head>
<body>
    <h1>Registration Form</h1>
    <hr>
    <form action="/submit.php">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter Name">
        </div>

        <div>
            <label for="phone no">Phone No</label>
            <input id="phone no" type="tel" placeholder="Enter Phone No">
        </div>

        <div>
            <label for="email">Email Id</label>
            <input id="email" type="email" placeholder="Enter Email Id">
        </div>

        <div>
            <label for="date">DOB</label>
            <input id="date" type="date" required>
        </div>

        <div>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter Password" required>
        </div>

        <div>
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value=""disabled selected>Selected Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>



        <div>
            <input id="terms" type="checkbox" required>
            <label for="terms">I Agree To The Term And Condition</label>
            
        </div>

        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
